[project]
name = "cortai-engine"
version = "0.1.0"
description = "Motor de IA local do Cortaí (sidecar)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "faster-whisper>=1.1",
  "opencv-python-headless>=4.10",
  "numpy>=1.26",
  # GPU NVIDIA no Windows/Linux: DLLs do cuBLAS/cuDNN usadas pelo CTranslate2 (faster-whisper)
  "nvidia-cublas-cu12>=12.4,<12.9; sys_platform != 'darwin'",
  "nvidia-cudnn-cu12>=9,<10; sys_platform != 'darwin'",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.pytest.ini_options]
pythonpath = ["."]
